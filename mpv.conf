# mpv.conf
#
# Windows + NVIDIA (RTX 4060 Ti) setup. For another GPU, delete the
# d3d11-adapter line and set gpu-api to the API the system supports.
# Fast by default: interpolation and upscaler shaders are opt-in
# with a key (see input.conf), not always on.
#
# Install: copy this whole folder to portable_config/ next to
# mpv.exe, or to %APPDATA%\mpv\ (portable_config wins if both
# exist). Do not add scripts/autoload.lua: mpv does not load a
# whole folder by itself, and that script turns one file into a
# whole-directory playlist. uosc autoload=no is set in uosc.conf
# as a second switch, but the script file must also be absent.

### General ###
include="~~/profiles.conf"
priority=high
keep-open=yes
loop-file=no
loop-playlist=no
save-position-on-quit=yes
watch-later-dir="~~/cache/watch_later"
snap-window=yes
autofit=50%x50%
fullscreen=no
window-maximized=no
cache=yes
demuxer-max-bytes=200MiB

### Video & Renderer ###
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
d3d11-adapter=NVIDIA
hwdec=auto-safe
hwdec-codecs=all
dither-depth=auto
# Crash log, off by default. Uncomment, reproduce the crash, then
# check portable_config/mpv.log for the last file/decoder.
# log-file="~~/mpv.log"

### Sync ###
# display-vdrop drops/duplicates a frame to match the monitor.
# display-resample + interpolation=yes re-times every frame and
# is much heavier. Press 'g' to toggle interpolation per file.
video-sync=display-vdrop
interpolation=no

### Audio ###
volume=50
volume-max=200
reset-on-next-file=volume,fullscreen
watch-later-options-remove=volume,fullscreen
audio-channels=auto-safe
audio-file-auto=fuzzy
audio-pitch-correction=yes

# Preferred languages
alang=ja,jp,jpn,jap,Japanese,en,eng,English
slang=en,eng,English

### Subtitles ###
# sub-ass-override=no keeps anime signs / karaoke placement intact.
sub-ass-override=no
sub-auto=fuzzy
blend-subtitles=no
sub-fix-timing=yes

# Custom style (plain .srt only, not ASS)
sub-font='Clear Sans Bold'
sub-font-size=52
sub-blur=0.5
sub-scale=0.9
sub-color='#d6ffffff'
sub-shadow-offset=5.0
sub-back-color='#00000000'
sub-outline-color='#ff6a678c'
sub-margin-y=60

### Debanding ###
# Off by default. Press 'd' to cycle it on for banding in dark scenes.
deband=no

### Interface ###
osc=no
border=no
# Hide the cursor after 1s idle, windowed mode included.
# uosc autohide=yes hides the whole UI with it.
cursor-autohide=1000
cursor-autohide-fs-only=no
osd-bar=no
osd-font='JetBrains Mono'
osd-font-size=30
osd-bold=yes
