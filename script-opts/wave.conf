# wave.conf — options for scripts/wave.lua
# The waveform is a track above the uosc controls, on the same
# time axis as the timeline. Layout (uosc 5.13, values from
# uosc.conf): timeline at the bottom, controls above it.
# Windowed 1080p: x=1, width=1918, top=954, bottom=1002.
# Fullscreen (scale_fullscreen=1.2): 58px high, top=929, bottom=987.
# height is the waveform track height, not the timeline bar.
height=48
speech_threshold=0.12
min_run_bars=2
sample_rate=8000
