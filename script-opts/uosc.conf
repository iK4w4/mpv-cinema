# uosc.conf — uosc 5.13.0 (scripts/uosc/)
# Dark glass theme, cyan accent. All persistency lines are empty on
# purpose: no element stays visible, everything fades on proximity
# and on cursor idle (cursor-autohide in mpv.conf, autohide below).

# --- Timeline: solid bar, not a thin line ---
timeline_style=bar
timeline_size=36
timeline_border=1
timeline_step=5
# timeline_cache=no: with cache=yes in mpv.conf, cache indicators
# draw as a striped texture over the timeline. Playback caching
# still works, it just is not drawn on the timeline.
timeline_cache=no

progress=never
progress_size=4
progress_line_width=20

# Fade rules, explicit: no element is persistent.
timeline_persistency=
controls_persistency=
volume_persistency=
speed_persistency=
top_bar_persistency=

# --- Controls: dense, not oversized ---
# uosc default controls list, minus shuffle, loop-playlist and
# loop-file. prev/playlist/next are kept for video episodes.
controls=menu,gap,subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,speed,space,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=2
volume=right
volume_size=40
volume_border=1
volume_step=1

# --- Top bar: title + filename underneath, windowed/borderless only ---
# With border=no in mpv.conf there is no native title bar, so uosc
# draws the minimize / maximize / close buttons itself.
top_bar=no-border
top_bar_size=40
top_bar_controls=right
top_bar_title=${media-title}
top_bar_alt_title=${filename}
top_bar_alt_title_place=below
top_bar_flash_on=video,audio,image

# --- Menus ---
menu_item_height=36
menu_min_width=280
menu_padding=6
menu_type_to_search=yes

# --- Look: dark glass, cyan accent ---
scale=1
scale_fullscreen=1.2
text_border=1.2
border_radius=8
window_border_size=1
color=foreground=22d3ee,foreground_text=000000,background=0b0f14,background_text=e9edf5,curtain=0b0f14,success=a5e075,error=ff616e
opacity=timeline=0.95,position=1,chapters=0.9,slider=0.95,slider_gauge=1,controls=0.92,speed=0.8,menu=0.97,submenu=0.9,border=1,title=1,tooltip=1,thumbnail=1,curtain=0.7,idle_indicator=0.9,audio_indicator=0.6,buffering_indicator=0.4,playlist_position=0.9

# --- Behaviour ---
animation_duration=120
proximity_in=40
proximity_out=120
autohide=yes
font_bold=no
destination_time=playtime-remaining
time_precision=0
pause_indicator=flash
autoload=no
shuffle=no

# --- Timeline chapter ranges: colour OP / ED sections ---
# Applies when a file has chapters named like these.
chapter_ranges=openings:22d3eeb0,endings:f59e0bb0
chapter_range_patterns=openings:Opening,OP,オープニング;endings:Ending,ED,エンディング
