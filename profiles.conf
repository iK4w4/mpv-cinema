### Upscaling profiles ###
# Applied with Ctrl+1..4 (see input.conf). profile-restore=copy-equal
# is required: apply-profile is destructive, without it the options
# set here (linear-downscaling, scale-antiring) leak into the next file.

[FSRCNNX]
profile-desc=HD Upscaling
profile-restore=copy-equal
glsl-shaders="~~/shaders/F8.glsl;~~/shaders/krigbl.glsl;~~/shaders/ssimsr.glsl;~~/shaders/ssimds.glsl"
linear-downscaling=no

[FSRCNNX+]
profile-desc=SD Upscaling (High Quality)
profile-restore=copy-equal
glsl-shaders="~~/shaders/F16.glsl;~~/shaders/krigbl.glsl;~~/shaders/ssimsr.glsl;~~/shaders/ssimds.glsl"
linear-downscaling=no
scale-antiring=0.8

[FSRCNNX-Anime]
profile-desc=Anime HD Upscaling
profile-restore=copy-equal
glsl-shaders="~~/shaders/F8_LA.glsl;~~/shaders/krigbl.glsl;~~/shaders/ssimsr.glsl;~~/shaders/ssimds.glsl"
linear-downscaling=no

[Anime4K]
profile-desc=Anime4K Standard
profile-restore=copy-equal
glsl-shaders="~~/shaders/krigbl.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl;~~/shaders/Anime4K_Clamp_Highlights.glsl"

### Auto-profiles ###

[4k-Downscaling]
profile-cond=(height >= 2160 or width >= 3840)
profile-restore=copy-equal
glsl-shaders-clr
linear-downscaling=no

[Anime]
# Any path containing "anime" (case-insensitive).
profile-cond=require 'mp.utils'.join_path(working_directory, path):lower():find('anime', 1, true)
profile-restore=copy-equal
deband=yes
deband-iterations=2
deband-threshold=35
sub-scale=0.75

[HDR]
# p[...] is the robust property form. A bare video-params/primaries
# reference parses as Lua arithmetic and the profile never applies.
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy-equal
target-trc=pq
target-peak=400
hdr-compute-peak=yes
# No forced output colour space: mpv decides the output mode and
# tone-maps HDR to SDR when needed.

[Downmix-Audio-5.1]
profile-cond=get("audio-params/channel-count") >= 5
profile-restore=copy-equal
# Pan coefficients are unnormalised by design; no volume boost
# before the pan, to avoid clipping. SL/SR are included so 7.1
# does not lose its side channels.
af=lavfi="lowpass=c=LFE:f=120,pan=stereo|FL=0.5*FC+0.707*FL+0.707*BL+0.707*SL+0.5*LFE|FR=0.5*FC+0.707*FR+0.707*BR+0.707*SR+0.5*LFE"
